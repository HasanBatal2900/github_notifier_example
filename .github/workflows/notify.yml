name: Telegram Notifications for Repository Events

# تحديد الأحداث
on:
  push:
    branches:
      - '**' 

  pull_request:
    types: [opened, reopened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    
    # شرط عدم الإرسال عند دمج طلبات السحب
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == false

    steps:
      - name: Send Telegram Notification
        # بداية طريقة HEREDOC باستخدام EOF
        run: |
          EVENT_TYPE="${{ github.event_name }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          MESSAGE=""
          
          # بناء الرسالة
          if [ "$EVENT_TYPE" == "push" ]; then
            BRANCH="${{ github.ref_name }}"
            MESSAGE="*✅ تحديث جديد (Push) على المستودع*
            👤 بواسطة: \${ACTOR}\
            📚 المستودع: \${REPO}\
            🔗 الفرع: \${BRANCH}\"
            
          elif [ "$EVENT_TYPE" == "pull_request" ]; then
            PR_ACTION="${{ github.event.action }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
            
            if [ "$PR_ACTION" == "opened" ]; then
              STATUS="🚀 طلب سحب جديد (Pull Request) تم فتحه"
            elif [ "$PR_ACTION" == "reopened" ]; then
              STATUS="🔄 طلب سحب تم إعادة فتحه"
            elif [ "$PR_ACTION" == "closed" ]; then
              STATUS="❌ طلب سحب تم إغلاقه"
            fi
            
            MESSAGE="*${STATUS}*
            👤 بواسطة: \${ACTOR}\
            📚 المستودع: \${REPO}\
            📝 العنوان: ${PR_TITLE}
            🔗 [عرض Pull Request #${PR_NUMBER}](${PR_URL})"
            
          else
            # رسالة افتراضية
            MESSAGE="*🔔 حدث جديد على المستودع*
            👤 بواسطة: \${ACTOR}\
            📚 المستودع: \${REPO}\
            ⚙️ نوع الحدث: \${EVENT_TYPE}\"
          fi
          
          # ترميز الرسالة (URL Encode)
          MESSAGE_ENCODED=$(echo -e "${MESSAGE}" | sed 's/ /%20/g' | sed 's/\n/%0A/g')
          
          # ------------------------------------
          # إرسال الرسالة عبر Telegram API (باستخدام الـ Secrets الآمنة)
          # ------------------------------------
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d "text=${MESSAGE_ENCODED}" \
          -d "parse_mode=Markdown"